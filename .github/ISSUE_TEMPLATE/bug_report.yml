name: Bug report
description: A command does something other than what the documentation says.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        CAUTION: Do not put a mnemonic, a private key or a configuration file
        with a `mnemonic:` field in this issue. Anybody can read it.

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `x402-celestia-rpc-payer version`.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - cosmos:mocha-5 (testnet)
        - cosmos:celestia (mainnet)
        - another network
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Give the command that you ran, and its complete output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        The output of `x402-celestia-rpc-payer check`. Remove the address if
        you want to keep it private.
      render: shell
