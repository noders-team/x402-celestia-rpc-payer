name: Feature request
description: Ask for a new command, a new flag, or a new behavior.
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you want
      description: Give the command line or the API that you want to use.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried
      description: Which other ways did you try, and why do they not work?
