name: CI

# A change enters main only through a pull request, and the pull request runs
# these checks. So a push to main runs nothing. To run the checks on main, start
# the workflow by hand in the Actions tab (workflow_dispatch).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      # The release workflows run "make dist". This step finds a target that
      # does not build before a tag does. It publishes nothing.
      - name: Build the release binaries
        run: make dist
      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Coverage
        run: go tool cover -func=coverage.txt | tail -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "These files are not formatted. Run: gofmt -s -w ."
            echo "$files"
            exit 1
          fi
      # The linter runs through "go run", and not through the action, so that
      # 1 pinned version covers CI and the Makefile.
      #
      # CAUTION: golangci-lint refuses a module whose Go version is above the
      # Go version that built the linter. Raise this pin when you raise the
      # "go" line of go.mod.
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  # The scan reports, but it does not block a merge. Read this report at each
  # release, and raise a dependency when a fix exists.
  #
  # The job is red when the code calls a vulnerability that is not in
  # VULN_IGNORE. govulncheck has no flag to ignore an advisory, so the job
  # reads the JSON output of govulncheck.
  #
  # Each entry in VULN_IGNORE needs a reason here:
  #
  #   GO-2026-5932  golang.org/x/crypto/openpgp is unmaintained, and the
  #                 advisory has no fix. cosmos-sdk reaches it through
  #                 client -> crypto/keyring -> crypto, and x/auth/tx, which
  #                 signs the payment, has the same path. So the payer cannot
  #                 remove it. The traces are package init and an err.Error()
  #                 call. The payer reads a mnemonic, and it does not use the
  #                 armored keyring export. Remove this entry when cosmos-sdk
  #                 no longer imports openpgp.
  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      VULN_IGNORE: GO-2026-5932
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          set -o pipefail

          # The JSON mode exits with 0 when it finds a vulnerability, so this
          # script makes the decision.
          govulncheck -format json ./... > vuln.json

          # A finding whose first frame names a function is a vulnerability
          # that the code calls. The text mode fails on these findings only.
          jq -r 'select(.finding.trace[0].function) | .finding
            | "\(.osv)  \(.trace[0].module)@\(.trace[0].version)  fixed in: \(.fixed_version // "none")"' \
            vuln.json | sort -u > called.txt

          # awk compares the complete advisory ID in the first field.
          new=$(awk -v ignore="${VULN_IGNORE}" '
            BEGIN { n = split(ignore, ids, " "); for (i = 1; i <= n; i++) skip[ids[i]] = 1 }
            !($1 in skip)' called.txt)

          echo "Ignored (see the comment in ci.yml): ${VULN_IGNORE:-none}"
          if [ -n "${new}" ]; then
            echo "The code calls these vulnerabilities:"
            echo "${new}"
            echo "Run \"govulncheck ./...\" to see the traces."
            exit 1
          fi
          echo "The code calls no other known vulnerability."
