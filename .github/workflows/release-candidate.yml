name: Release candidate

# A release candidate tag (vX.Y.Z-rc.N) builds the RC container image once and
# deploys it to the stage environment. The final release (vX.Y.Z) later
# promotes the SAME image digest to prod. Do not rebuild for prod.
#
# See docs/RELEASE.md for the complete flow.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write   # create the GitHub prerelease
  packages: write   # push the image to the registry

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push the RC image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set the image references
        id: ref
        run: |
          repo="${REGISTRY}/${IMAGE_NAME,,}"
          {
            echo "repo=${repo}"
            echo "image=${repo}:${GITHUB_REF_NAME}"
            echo "sha_tag=${repo}:sha-${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  deploy-stage:
    name: Deploy to stage
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: stage
    steps:
      - name: Show the image to deploy
        run: |
          echo "Deploy the RC image to stage."
          echo "  image:  ${{ needs.build.outputs.image }}"
          echo "  digest: ${{ needs.build.outputs.digest }}"

      - name: Deploy
        run: |
          # TODO: put the real stage deploy command here.
          #
          # Deploy this exact digest, so that prod later promotes the same
          # artifact:
          #   ${{ env.REGISTRY }}/${{ github.repository }}@${{ needs.build.outputs.digest }}
          echo "Add the stage deploy command here."

  prerelease:
    name: Create the GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --prerelease
